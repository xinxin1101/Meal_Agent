<!doctype html><html><body>
<main><h1>青菜豆腐汤示例</h1><p class="author"><a>学习作者二</a> 发布</p>
<ul class="recipe-meta"><li>初级</li><li>煮</li><li>清淡</li><li>廿分钟</li></ul>
<h2>食材明细</h2><h3>主料</h3><ul><li data-name="豆腐" data-amount="300克">豆腐300克</li><li data-name="青菜" data-amount="100克">青菜100克</li></ul>
<h3>辅料</h3><ul><li data-name="清水" data-amount="600毫升">清水600毫升</li></ul>
<h2>青菜豆腐汤示例的做法步骤</h2><ul><li><p>1.豆腐切块，青菜洗净。</p></li><li><p>2.清水煮开后放入豆腐。</p></li><li><p>3.加入青菜煮熟即可。</p></li></ul>
<h3>小窍门</h3><p>使用的厨具：汤锅</p><p>分类：汤羹 晚餐</p></main>
</body></html>
