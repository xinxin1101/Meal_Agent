<!doctype html><html><body>
<div class="recipe_De_title"><h1>土豆炖牛肉示例</h1><a>学习作者八</a></div>
<ul><li data-label="口味">咸鲜</li><li data-label="工艺">炖</li><li data-label="耗时">一小时</li><li data-label="难度">中级</li></ul>
<h2>食材明细</h2><h3>主料</h3><ul><li data-name="牛肉" data-amount="400克">牛肉400克</li><li data-name="土豆" data-amount="300克">土豆300克</li></ul>
<h3>辅料</h3><ul><li data-name="清水" data-amount="800毫升">清水800毫升</li></ul>
<h2>土豆炖牛肉示例的做法步骤</h2><ol><li><div class="recipeStep_word"><em>1.</em><p>牛肉切块焯水。</p></div></li><li><div class="recipeStep_word"><em>2.</em><p>加入清水炖煮。</p></div></li><li><div class="recipeStep_word"><em>3.</em><p>加入土豆继续炖熟。</p></div></li></ol>
<p>使用的厨具：炖锅</p><p>分类：热菜 午餐 晚餐</p>
