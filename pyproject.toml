[project]
name = "mealpilot"
version = "0.1.0"
description = "Constraint-aware meal planning MVP"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "ortools>=9.10,<10.0",
  "langgraph>=1.0,<2.0",
  "openai>=1.0,<2.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
ingestion = []
production = [
  "alembic>=1.14,<2.0",
  "prometheus-client>=0.21,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["mealpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
